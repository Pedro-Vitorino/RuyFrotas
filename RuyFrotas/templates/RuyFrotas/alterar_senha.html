{% extends "RuyFrotas/base.html" %}
{% load static %}
{% load crispy_forms_filters %}

{% block "title" %}Alterar senha{% endblock %}

{% block conteudo %}

<section class="py-5 container">


<div class="card card-primary card-outline mb-4">

    <div class="card-header">
        <div class="card-title">Alterar senha</div>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="card-body">
            {{ form|crispy }}
        </div>

        <div class="card-footer">
            <input type="submit" value="Alterar senha" class="btn btn-primary">
            <a href="{% url 'minha_conta' %}" class="btn btn-secondary">Cancelar</a>
        </div>

    </form>

</div>


</section>
{% endblock %}
