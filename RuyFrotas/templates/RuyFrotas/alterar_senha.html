{% extends "RuyFrotas/base.html" %}

{% block "title" %}Alterar senha{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card">

        <div class="card-header">
            <h3 class="card-title">
                Alterar senha
            </h3>
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="card-body">

                {{ form.as_p }}

            </div>

            <div class="card-footer">

                <button type="submit" class="btn btn-primary">
                    Alterar senha
                </button>

                <a href="{% url 'minha_conta' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
