{% extends "RuyFrotas/base.html" %}

{% block "title" %}Redefinir senha{% endblock %}

{% block conteudo %}

<section class="py-5 container">

    <div class="card card-primary card-outline mb-4">

        <div class="card-header">
            <div class="card-title">Redefinir senha</div>
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="card-body">

                <p>
                    Digite o e-mail associado à sua conta.
                    Enviaremos instruções para redefinir sua senha.
                </p>

                {{ form.as_p }}

            </div>

            <div class="card-footer">

                <button type="submit" class="btn btn-primary">
                    Enviar instruções
                </button>

                <a href="{% url 'login' %}" class="btn btn-secondary">
                    Voltar
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
